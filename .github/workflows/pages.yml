# GitHub Pages deployment for the Numkit IDE.
#
# How it works:
#   - You build the IDE locally with `bash deploy.sh` (or `deploy.bat`).
#     That regenerates docs/ with the Vite production bundle, the WASM
#     binary copied from build-browser/wasm/dist/, and the .nojekyll
#     marker. Commit + push docs/ to main as part of your PR.
#   - This workflow watches main for changes and publishes docs/ to
#     GitHub Pages via the official actions/deploy-pages flow.
#   - The final step prunes every deployment in the github-pages
#     environment except the just-published one — we never accumulate
#     deployment records (we hit a soft-limit at 818 once and Pages
#     wedged for ~16h, never again).
#
# Pre-requisite (one-time):
#   Settings → Pages → Source: GitHub Actions

name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: write

# Cancel a running deploy if a newer push lands — only the latest
# deploy ever needs to finish.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload docs/ as artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Auto-cleanup: keep only the deployment we just made; delete
      # every older github-pages deployment record. Required dance per
      # GitHub API: POST status=inactive, then DELETE.
      - name: Prune old Pages deployments
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo  = context.repo.repo;
            const keepId = ${{ steps.deployment.outputs.deployment_id || 0 }};

            // Page through ALL github-pages deployments.
            const all = [];
            let page = 1;
            while (true) {
              const { data } = await github.rest.repos.listDeployments({
                owner, repo, environment: 'github-pages',
                per_page: 100, page,
              });
              all.push(...data);
              if (data.length < 100) break;
              page += 1;
            }
            core.info(`Found ${all.length} github-pages deployment(s); keeping id=${keepId}`);

            const doomed = all.filter(d => d.id !== keepId);
            let ok = 0, fail = 0;
            for (const d of doomed) {
              try {
                await github.rest.repos.createDeploymentStatus({
                  owner, repo, deployment_id: d.id, state: 'inactive',
                });
                await github.rest.repos.deleteDeployment({
                  owner, repo, deployment_id: d.id,
                });
                ok += 1;
              } catch (e) {
                fail += 1;
                core.warning(`delete id=${d.id} sha=${d.sha.slice(0,8)}: ${e.message}`);
              }
            }
            core.info(`Pruned ${ok} old deployment(s); ${fail} failure(s).`);
